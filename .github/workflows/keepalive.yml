name: Keep Render alive

on:
  schedule:
    # GitHub Actions cron has an effective minimum of ~5 minutes,
    # which is still well under Render's 15-minute idle timeout.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping services
        run: |
          urls=(
            "https://backend-5-7b3r.onrender.com/products"
          )
          for url in "${urls[@]}"; do
            echo "→ $url"
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$url" || echo "000")
            echo "  status: $code"
            [ "$code" = "200" ] || echo "  (non-200, but service was woken)"
          done
